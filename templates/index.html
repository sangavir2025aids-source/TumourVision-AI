<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TumourVision AI - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5f9, #f5fbfc);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #176b87;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #176b87;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #176b87;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #12566d;
        }

        .info {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">🩺</div>

        <h1>TumourVision AI</h1>

        <p class="subtitle">
            Precision Liver Tumour Segmentation using AI
        </p>

        <form action="/dashboard" method="POST">

            <!-- PATIENT ID -->

            <div class="input-group">

                <label for="patient_id">
                    Patient ID
                </label>

                <input
                    type="text"
                    id="patient_id"
                    name="patient_id"
                    placeholder="Enter patient ID"
                    required>

            </div>


            <!-- PATIENT NAME -->

            <div class="input-group">

                <label for="name">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter patient name"
                    required>

            </div>


            <!-- PATIENT AGE -->

            <div class="input-group">

                <label for="age">
                    Patient Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter patient age"
                    min="1"
                    max="120"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email ID
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit" class="login-btn">
                Continue to Dashboard
            </button>

        </form>


        <p class="info">
            This system provides AI-assisted liver tumour
            segmentation from CT scan images.
        </p>

        <p class="footer">
            TumourVision AI © 2026
        </p>

    </div>

</body>

</html>
